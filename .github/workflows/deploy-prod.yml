name: Deploy to Production

on:
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-1

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    environment: production

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements_dev.txt
        pip install -r requirements.txt
        pip install chalice
        npm install -g aws-cdk@latest
        sudo apt-get update && sudo apt-get install -y jq

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Chalice Lambda Layer
      run: |
        chmod +x chalice_app/scripts/build-layer.sh
        bash chalice_app/scripts/build-layer.sh

    - name: CDK Deploy (Infrastructure - Prod)
      run: cdk deploy --require-approval never --context infrastructure_env=prod --import-existing-resources

    - name: Publish Lambda Layer
      working-directory: chalice_app
      run: |
        python scripts/publish_layer.py shopping-assistant-chalice-layer --region ${{ env.AWS_REGION }}

    - name: Prune API Gateway invoke permissions
      run: |
        python .github/scripts/prune_lambda_policy.py --stage chalice-prod --region ${{ env.AWS_REGION }}

    - name: Cleanup Unused API Gateway REST APIs
      working-directory: chalice_app
      continue-on-error: true
      run: |
        python scripts/cleanup_unused_apis.py \
          --region ${{ env.AWS_REGION }} \
          --min-age-days 0 \
          --delay-seconds 1.0 \
          --countdown-seconds 2 \
          --api-name-filter shopping-assistant-api \
          --execute || echo "API cleanup completed with warnings (non-blocking)"

    - name: Deploy Chalice stage with validation
      run: |
        python chalice_app/scripts/deploy.py --stage chalice-prod --region ${{ env.AWS_REGION }}

    - name: Verify Layer Attachment
      working-directory: chalice_app
      run: |
        echo "Verifying layer attachment..."
        STAGE="chalice-prod"
        REGION="${{ env.AWS_REGION }}"
        LAYER_NAME="shopping-assistant-chalice-layer"

        FUNCTIONS=$(aws lambda list-functions \
            --region "$REGION" \
            --query "Functions[?starts_with(FunctionName, 'shopping-assistant-api-${STAGE}')].FunctionName" \
            --output text)

        MISSING_COUNT=0
        for FUNCTION in $FUNCTIONS; do
          LAYERS=$(aws lambda get-function-configuration \
              --function-name "$FUNCTION" \
              --region "$REGION" \
              --query 'Layers[*].Arn' \
              --output text)

          if echo "$LAYERS" | grep -q "$LAYER_NAME"; then
            echo "OK: $FUNCTION"
          else
            echo "MISSING: $FUNCTION"
            MISSING_COUNT=$((MISSING_COUNT + 1))
          fi
        done

        if [ $MISSING_COUNT -gt 0 ]; then
          echo "::error::$MISSING_COUNT function(s) missing the layer."
          exit 1
        fi
        echo "All functions have the layer attached."
